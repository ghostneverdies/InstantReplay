<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Instant Replay settings with save folder, WebView2 playback notice and logging controls">
  <rect width="640" height="360" fill="#eef0f2"/>
  <rect x="18" y="16" width="604" height="328" rx="12" fill="#151a1f" stroke="#2d353d"/>
  <path d="M18 28a12 12 0 0 1 12-12h580a12 12 0 0 1 12 12v24H18z" fill="#1c2228"/>
  <circle cx="40" cy="34" r="4" fill="#4d565f"/><circle cx="55" cy="34" r="4" fill="#4d565f"/><circle cx="70" cy="34" r="4" fill="#4d565f"/>
  <text x="320" y="38" fill="#d9e0e6" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Instant Replay — Settings</text>
  <rect x="18" y="52" width="78" height="292" fill="#11161b"/>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#929ba3">
    <circle cx="38" cy="80" r="3" fill="#77818a"/><text x="48" y="84">Home</text>
    <circle cx="38" cy="112" r="3" fill="#77818a"/><text x="48" y="116">Gallery</text>
    <circle cx="38" cy="144" r="3" fill="#a1ffcb"/><text x="48" y="148" fill="#a1ffcb">Settings</text>
    <circle cx="38" cy="176" r="3" fill="#77818a"/><text x="48" y="180">Updates</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="118" y="86" fill="#eef2f5" font-size="16" font-weight="600">Storage and playback</text>
    <rect x="118" y="102" width="484" height="58" rx="8" fill="#1b2228" stroke="#303941"/>
    <text x="136" y="126" fill="#e4e9ed" font-size="12">Save folder</text>
    <text x="136" y="145" fill="#8d979f" font-size="10">Pictures\Instant Replay</text>
    <rect x="510" y="120" width="74" height="24" rx="6" fill="#24302a" stroke="#a1ffcb"/>
    <text x="547" y="136" fill="#a1ffcb" font-size="10" text-anchor="middle">Change</text>
    <rect x="118" y="170" width="484" height="58" rx="8" fill="#28231a" stroke="#6b5834"/>
    <circle cx="140" cy="199" r="7" fill="#ffcf6b"/>
    <text x="157" y="196" fill="#ffcf6b" font-size="12">WebView2 Runtime not installed</text>
    <text x="157" y="213" fill="#c1b493" font-size="10">Clips still save. Playback needs the runtime.</text>
    <rect x="118" y="238" width="484" height="42" rx="8" fill="#1b2228" stroke="#303941"/>
    <text x="136" y="264" fill="#e4e9ed" font-size="12">Debug logging</text>
    <rect x="548" y="248" width="36" height="20" rx="10" fill="#28332d"/>
    <circle cx="566" cy="258" r="7" fill="#a1ffcb"/>
    <rect x="118" y="290" width="484" height="30" rx="8" fill="#1b2228" stroke="#303941"/>
    <text x="136" y="310" fill="#8d979f" font-size="10">Buffer method: Continuous</text>
  </g>
