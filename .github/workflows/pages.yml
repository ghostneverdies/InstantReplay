name: Deploy website

# Publishes the static site at the branch root to GitHub Pages.
# Set Settings -> Pages -> Build and deployment -> Source to "GitHub Actions" once.
# Run this workflow manually from the Actions tab to deploy.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: website

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # A re-run keeps artifacts from earlier attempts, which makes
      # deploy-pages fail with "Multiple artifacts named github-pages".
      - name: Remove previous Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids="$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')"
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
