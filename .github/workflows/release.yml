name: Release

# Manual only. Run it from the Actions tab or with:
#   gh workflow run release.yml -f version=1.6.0
# It builds the portable ZIP and the installer, then creates (or refreshes) the GitHub
# Release for tag v<version>. Run it from the default branch so the tag points at the
# commit you intend to release; no tag push or published release triggers it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp and release, e.g. 1.6.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}"
          if ($raw -notmatch '^[vV]?\d+\.\d+(\.\d+){0,2}$') {
            throw "Version '$raw' is not valid (expected 1.6, 1.6.0 or 1.6.0.1)."
          }
          $version = $raw.TrimStart('v', 'V')

          # NSIS VIProductVersion needs exactly four numeric parts.
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 4) { $parts += '0' }
          $quad = $parts -join '.'

          "version=$version" >> $env:GITHUB_OUTPUT
          "quad=$quad"       >> $env:GITHUB_OUTPUT
          "tag=v$version"    >> $env:GITHUB_OUTPUT

          Write-Host "Building version $version (file version $quad, tag v$version)"

      # The app targets .NET Framework 4.8 (WPF + WPF-UI). The windows runner already has the
      # 4.8 targeting pack, and MSBuild from Visual Studio builds the SDK-style project.
      - name: Set up MSBuild (.NET Framework 4.8)
        uses: microsoft/setup-msbuild@v2

      - name: Build native engine
        shell: cmd
        run: |
          call engine\engine_core\build.bat
          if errorlevel 1 exit /b 1
          if not exist engine\bin\engine.dll (echo engine.dll was not produced & exit /b 1)

      - name: Publish application
        shell: pwsh
        run: |
          msbuild InstantReplay.csproj -t:Restore -p:Configuration=Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "msbuild restore failed" }
          msbuild InstantReplay.csproj `
            -t:Publish `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:PublishDir="$PWD\bin\publish\win-x64\"
          if ($LASTEXITCODE -ne 0) { throw "msbuild publish failed" }

      - name: Verify publish layout
        shell: pwsh
        run: |
          $dir = "bin/publish/win-x64"
          $required = @(
            "InstantReplay.exe",
            "engine/bin/engine.dll",
            "engine/hooks/bin/capture_hook.dll",
            "engine/hooks/bin/overlay_hook.dll",
            "assets/games/games.json",
            "assets/games/anticheat_games.json"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw "Publish output is missing: $($missing -join ', ')" }
          Write-Host "Publish layout OK ($((Get-ChildItem $dir -Recurse -File).Count) files)."

      - name: Build portable archive
        shell: pwsh
        run: |
          $name = "InstantReplay-${{ steps.version.outputs.version }}-win64-portable"
          # 7z is fast and memory-friendly; fall back to Compress-Archive.
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            & $sevenZip a -tzip -mx=5 -bso0 -bsp0 "$name.zip" ".\bin\publish\win-x64\*"
            if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          } else {
            Compress-Archive -Path "bin/publish/win-x64/*" -DestinationPath "$name.zip" -CompressionLevel Optimal
          }
          Write-Host "Portable archive: $name.zip ($([math]::Round((Get-Item "$name.zip").Length / 1MB, 1)) MB)"

      - name: Build installer
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            Write-Host "NSIS not found, installing..."
            choco install nsis -y --no-progress
            $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) { throw "makensis.exe not found" }

          # Run from installer\ so the script's relative paths (..\bin\publish\win-x64,
          # ..\assets\icons, terms.txt) resolve exactly as they do locally.
          Push-Location installer
          try {
            & $makensis /V2 `
              "/DMyAppVersion=${{ steps.version.outputs.version }}" `
              "/DMyAppVersion4=${{ steps.version.outputs.quad }}" `
              "installer.nsi"
            if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          if (-not (Test-Path installer/InstantReplaySetup.exe)) { throw "installer output missing" }
          Write-Host "Installer: $([math]::Round((Get-Item installer/InstantReplaySetup.exe).Length / 1MB, 1)) MB"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InstantReplay-${{ steps.version.outputs.version }}-win64
          path: |
            InstantReplay-${{ steps.version.outputs.version }}-win64-portable.zip
            installer/InstantReplaySetup.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at the current commit if it does not exist yet.
          tag_name: ${{ steps.version.outputs.tag }}
          name: Instant Replay ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          # The asset must stay named InstantReplaySetup.exe: the in-app updater looks for
          # exactly that file on the latest release.
          files: |
            InstantReplay-${{ steps.version.outputs.version }}-win64-portable.zip
            installer/InstantReplaySetup.exe

