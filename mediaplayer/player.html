<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instant Replay</title>
  <link rel="stylesheet" href="player.css" />
</head>

<body>
  <video id="v" playsinline preload="auto"></video>

  <button id="closeBtn" class="btn close-btn" aria-label="Close" title="Close">
    <svg viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
  </button>

  <div id="center">
    <button id="bigPlay" class="big" aria-label="Play" title="Play (Space)">
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
    </button>
    <button id="bigReplay" class="big" hidden>
      <svg viewBox="0 0 24 24">
        <path d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z" />
      </svg>
    </button>
    <div id="error" hidden>
      <p>Couldn't play this replay.</p>
      <button id="retry">Retry</button>
    </div>
  </div>

  <div id="bar">
    <button id="playPause" class="btn" aria-label="Play / pause" title="Play / pause (Space)">
      <svg viewBox="0 0 24 24">
        <path id="icPlay" d="M8 5v14l11-7z" />
        <path id="icPause" d="M6 5h4v14H6zm8 0h4v14h-4z" style="display:none" />
      </svg>
    </button>

    <span id="cur" class="time">0:00</span>

    <input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Seek" />

    <span id="dur" class="time">0:00</span>

    <button id="mute" class="btn" aria-label="Mute / unmute" title="Mute (M)">
      <svg viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3z" />
        <path id="icWave" d="M16.5 12c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z" opacity="0" />
        <path id="icSlash" d="M5 2.5 L19 21.5" style="display:none" />
      </svg>
    </button>

    <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />

    <button id="fs" class="btn" aria-label="Toggle fullscreen" title="Fullscreen (F)">
      <svg viewBox="0 0 24 24">
        <path id="icExpand" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
        <path id="icCompress" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"
          style="display:none" />
      </svg>
    </button>
  </div>

  <script src="player.js"></script>
</body>

</html>
