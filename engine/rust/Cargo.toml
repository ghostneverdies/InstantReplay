[package]
name = "instantreplay_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
] }
wasapi = "0.15"
windows-capture = "2.0.1"
rayon = "1.12"

[patch.crates-io]
windows-capture = { path = "vendor/windows-capture" }

[profile.release]
opt-level = 2
lto = "fat"
panic = "unwind"
